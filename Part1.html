<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Web Component</title>
</head>
<body>
  <!-- Custom web component with attributes -->
  <my-component text="Hello, Web Component!" style="color: blue; font-size: 20px;">
    <!-- Assign content to specific slots -->
    <span slot="header">This is the header content</span>
    <span slot="footer">This is the footer content</span>
  </my-component>

  <template id="my-component-template">
    <style>
      :host {
        display: block;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: #f9f9f9;
      }

      .header {
        font-weight: bold;
        color: darkblue;
      }

      .footer {
        color: darkgreen;
        font-style: italic;
      }
    </style>

    <div class="header">
      <!-- Slot for header content -->
      <slot name="header">Default Header</slot>
    </div>
    <div class="body">
      <p>
        <!-- Default content in body slot -->
        <slot></slot>
      </p>
    </div>
    <div class="footer">
      <!-- Slot for footer content -->
      <slot name="footer">Default Footer</slot>
    </div>
  </template>

  <script>
    class MyComponent extends HTMLElement {
      constructor() {
        super();
        const template = document.getElementById('my-component-template');
        const templateContent = template.content;
        this.attachShadow({mode: 'open'}).appendChild(templateContent.cloneNode(true));

        // Set text content and style from properties
        const text = this.getAttribute('text');
        const style = this.getAttribute('style');
        
        this.shadowRoot.querySelector('.body p').textContent = text;
        this.style.cssText = style;
      }
    }

    // Define the custom element
    customElements.define('my-component', MyComponent);
  </script>
</body>
</html>
