<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Menu</title>
</head>
<body>

<my-component text="Welcome to the Adventure Game!" style="background-color: #222; color: #fff; font-size: 20px;">
    <h1 slot="header">Adventure Game</h1>

    <div slot="body">
        <button>Start Game</button>
        <button>Settings</button>
        <button>High Scores</button>
    </div>
    
    <div slot="footer">
        <p>Created by: Taka Kiucchi</p>
    </div>
</my-component>

<template id="my-component-template">
    <style>
        :host {
            display: block;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .header {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .body {
            margin-bottom: 20px;
        }
        .footer {
            font-size: 0.9rem;
            color: #bbb;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background-color: #555;
        }
    </style>
    <div class="header">
        <slot name="header">Default Header</slot>
    </div>
    <div class="body">
        <slot name="body">Default Body</slot>
    </div>
    <div class="footer">
        <slot name="footer">Default Footer</slot>
    </div>
</template>

<script>
    class MyComponent extends HTMLElement {
        constructor() {
            super();
            const template = document.getElementById('my-component-template');
            const templateContent = template.content;
            this.attachShadow({mode: 'open'}).appendChild(templateContent.cloneNode(true));

            const text = this.getAttribute('text');
            const style = this.getAttribute('style');
            this.shadowRoot.querySelector('.body').textContent = text;
            this.style.cssText = style;
        }
    }
    customElements.define('my-component', MyComponent);
</script>

</body>
</html>
