<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 1 - Web Component</title>
</head>
<body>
    <my-component text="Hello, Web Component!" style="background-color: lightblue; font-size: 20px;">
        <span slot="header">This is the header content</span>
        <div slot="body">This is the body content</div>
    </my-component>

    <script>
        class MyComponent extends HTMLElement {
            constructor() {
                super();
                this.attachShadow({ mode: 'open' });
                this.shadowRoot.innerHTML = `
                    <style>
                        div {
                            padding: 10px;
                            border-radius: 5px;
                            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
                        }
                    </style>
                    <div style="${this.getAttribute('style')}">
                        <h1><slot name="header"></slot></h1>
                        <p><slot name="body"></slot></p>
                        <p>${this.getAttribute('text')}</p>
                    </div>
                `;
            }
        }

        customElements.define('my-component', MyComponent);
    </script>
</body>
</html>
