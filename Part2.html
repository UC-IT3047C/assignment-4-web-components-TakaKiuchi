<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Menu</title>
</head>
<body>

<!-- Game Menu Web Component -->
<my-component text="Welcome to the Adventure Game!" style="background-color: #222; color: #fff; font-size: 20px;">
    <!-- Header Slot: Game Title / Logo -->
    <h1 slot="header">Adventure Game</h1>
    
    <!-- Body Slot: Game Options (Buttons) -->
    <div slot="body">
        <button>Start Game</button>
        <button>Settings</button>
        <button>High Scores</button>
    </div>
    
    <!-- Footer Slot: Credits or Version Info -->
    <div slot="footer">
        <p>Created by: Your Name</p>
        <p>Version 1.0</p>
    </div>
</my-component>

<!-- Script Reference -->
<script src="Part2.js"></script>

</body>
</html>
